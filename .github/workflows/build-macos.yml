name: Build macOS DMG
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build macOS app with PyInstaller
      run: |
        pyinstaller --name="VideoWatermarkTool" \
                    --windowed \
                    --icon=lg.ico \
                    --add-data="lg.ico:." \
                    --osx-bundle-identifier="com.simonpitt.videowatermarktool" \
                    main.py
    
    - name: Create ad-hoc code signature
      run: |
        codesign --force --deep --sign - "dist/VideoWatermarkTool.app"
    
    - name: Verify code signature
      run: |
        codesign --verify --verbose "dist/VideoWatermarkTool.app"
        codesign -dv "dist/VideoWatermarkTool.app"
    
    - name: Create DMG
      run: |
        # Install create-dmg
        brew install create-dmg
        
        # Create DMG
        create-dmg \
          --volname "Video Watermark Tool" \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --app-drop-link 600 185 \
          "VideoWatermarkTool.dmg" \
          "dist/VideoWatermarkTool.app" || true
        
        # If create-dmg fails, create a simple DMG
        if [ ! -f "VideoWatermarkTool.dmg" ]; then
          hdiutil create -volname "Video Watermark Tool" -srcfolder "dist/VideoWatermarkTool.app" -ov -format UDZO "VideoWatermarkTool.dmg"
        fi
    
    - name: Upload DMG as artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-dmg
        path: VideoWatermarkTool.dmg
    
    - name: Upload app bundle as artifact (for testing)
      uses: actions/upload-artifact@v4
      with:
        name: macos-app
        path: dist/VideoWatermarkTool.app
